<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선한목자교회 · 1층 성전보수 오픈 진도표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --g:#07913B; --gl:#F1F8F3; --gd:#056B2C;
    --ink:#2c2a26; --soft:#55534e; --mut:#8a847a;
    --line:#dcd9d1; --line2:#eeece6; --bg:#faf9f5; --card:#fff;
    --warn:#B3382A; --warnbg:#FDF3F0; --amber:#9A6414; --amberbg:#FBF3E6;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--ink);
    font-family:'IBM Plex Sans KR',sans-serif;font-size:13.5px;line-height:1.7}
  .wrap{max-width:1000px;margin:0 auto}
  a{color:inherit;text-decoration:none}

  .navrow{font-size:11.5px;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line2);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .navrow a.back{color:var(--gd);font-weight:600}

  /* ── 인쇄 · 저장 버튼 ── */
  .tools{display:inline-flex;gap:6px;align-items:center}
  .tbtn{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:12px;
    font-weight:600;color:#55534e;background:#fff;border:1px solid #dcd9d1;border-radius:999px;
    padding:4px 11px;cursor:pointer;line-height:1.4}
  .tbtn:hover{background:#f2f0e9;border-color:#c9c4b8}
  .tbtn:disabled{opacity:.5;cursor:default}
  .tbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  @media print{.tools{display:none !important}}

  @media print{
    .navrow,.ctl,.foot{display:none !important}
    body{background:#fff}
    .wrap{max-width:none;padding:0}
  }
  body.shot .navrow,body.shot .ctl,body.shot .foot{display:none !important}
  .head{padding:18px 0 4px;position:relative}
  .head .tools{position:absolute;right:0;top:20px}

  h1{font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;margin:0;letter-spacing:-.6px}
  .lead{font-size:13px;color:var(--soft);margin-top:6px}

  /* 요약 바 */
  .sum{margin-top:16px;background:var(--card);border:1px solid #e6e1d7;border-radius:13px;
    padding:15px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .dday{flex:none;text-align:center;padding-right:20px;border-right:1px solid var(--line2)}
  .dday b{display:block;font-family:'Gowun Batang',serif;font-size:34px;font-weight:700;
    color:var(--gd);line-height:1.1;letter-spacing:-1px}
  .dday span{font-size:11.5px;color:var(--mut)}
  .sumg{flex:1;min-width:230px}
  .sumg .t{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;margin-bottom:6px}
  .sumg .t b{color:var(--ink);font-weight:700}
  .bar{height:7px;background:#ece7dd;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:7px;background:var(--g);border-radius:4px}
  .stt{display:flex;gap:7px;flex-wrap:wrap}
  .stt span{font-size:11.5px;font-weight:600;border-radius:9px;padding:3px 10px;background:#f2f0e9;color:#6e6860}

  /* 필터 */
  .ctl{margin:16px 0 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--mut);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
  .chip:hover{color:var(--ink)}
  .chip.on{color:#fff;background:var(--gd);border-color:var(--gd)}
  .ctl .sp{margin-left:auto;font-size:11.5px;color:var(--mut)}


  /* 보기 전환 */
  .vsw{display:flex;width:100%;border-bottom:2px solid var(--line);margin:4px 0 6px;gap:4px}
  .vb{flex:1;font-family:inherit;font-size:15px;font-weight:800;color:var(--mut);background:none;
    border:none;border-bottom:4px solid transparent;margin-bottom:-2px;padding:12px 6px 10px;cursor:pointer;
    white-space:nowrap}
  .vb:hover{color:var(--ink);background:#f2f0e9;border-radius:10px 10px 0 0}
  .vb.on{color:var(--gd);border-bottom-color:var(--g);background:var(--gl,#E8F4EC);border-radius:10px 10px 0 0}
  @media(max-width:560px){.vb{font-size:13.5px;padding:11px 2px 9px}}

  /* 전체 일정 (간트) */
  .gt{background:var(--card);border:1px solid #e6e1d7;border-radius:13px;padding:0 0 10px;overflow:hidden}
  .gwrap{overflow-x:auto}
  .grid{min-width:860px}
  .ghead{display:grid;grid-template-columns:132px repeat(9,1fr);position:sticky;top:0;z-index:3;
    background:var(--card);border-bottom:2px solid var(--line)}
  .ghead .gh{padding:9px 4px 8px;text-align:center;font-size:11.5px;color:var(--mut);
    border-left:1px solid var(--line2)}
  .ghead .gh b{display:block;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
  .ghead .gh.now{background:#eef6f0}
  .ghead .gh.now b{color:var(--gd)}
  .ghead .gh.op b{color:var(--amber)}
  .ghead .gc{padding:9px 12px 8px;font-size:11.5px;color:var(--mut)}

  .gband{display:flex;align-items:center;gap:9px;padding:9px 13px 8px;background:#f2f0e9;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line2)}
  .gband b{font-family:'Gowun Batang',serif;font-size:17px;font-weight:700;letter-spacing:-.5px}
  .gband em{font-style:normal;font-size:11.5px;color:var(--mut)}
  .gband span{margin-left:auto;font-size:11.5px;color:var(--mut)}
  .gband.선지서점{background:#eef5f0}.gband.선지서점 b{color:var(--gd)}
  .gband.로뎀카페{background:#faf2e4}.gband.로뎀카페 b{color:#8a5a14}

  .grow{display:grid;grid-template-columns:132px repeat(9,1fr);border-bottom:1px solid #f3f1ea}
  .grow:last-child{border-bottom:none}
  .gname{padding:7px 10px;font-size:12px;font-weight:700;color:var(--soft);
    border-right:1px solid var(--line2);display:flex;align-items:center}
  .glanes{grid-column:2/-1;display:flex;flex-direction:column;gap:3px;padding:5px 0}
  .glane{display:grid;grid-template-columns:repeat(9,1fr);align-items:center}
  .gcell{height:100%;border-left:1px solid #f3f1ea}
  .gbar{margin:0 3px;border-radius:6px;padding:4px 8px 5px;font-size:11.5px;font-weight:600;
    line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
    border:1px solid transparent;display:block;color:var(--ink)}
  .gbar:hover{filter:brightness(.96)}
  .gbar.주문결제{background:#e8f0fa;border-color:#c2d6ee;color:#1d5fa8}
  .gbar.선지서점{background:#e6f2ea;border-color:#bcd9c3;color:var(--gd)}
  .gbar.로뎀카페{background:#fbf0dd;border-color:#e6d2a8;color:#8a5a14}
  .gbar.제작물{background:#FBF3E6;border-color:#e3d6bb;color:#9A6414}
  .gbar.공사현장{background:#eeece6;border-color:#dcd6c8;color:#55534e}
  .gbar.행정{background:#f2eafa;border-color:#ddcdee;color:#7a3fa0}
  .gbar.dec{box-shadow:inset 3px 0 0 var(--warn)}
  .gbar.now2{box-shadow:inset 3px 0 0 var(--g)}

  @media(max-width:760px){ .grid{min-width:760px} .ghead,.grow{grid-template-columns:104px repeat(9,1fr)} }

  /* 큰 구간 */
  .ph{display:flex;align-items:baseline;gap:12px;margin:26px 0 11px;padding-bottom:9px;
    border-bottom:3px solid var(--gd)}
  .ph b{font-family:'Gowun Batang',serif;font-size:26px;font-weight:700;letter-spacing:-.8px;color:var(--gd)}
  .ph em{font-style:normal;font-size:13px;color:var(--mut)}
  .ph span{margin-left:auto;font-size:12.5px;color:var(--mut)}
  .ph.open{border-bottom-color:var(--amber)}
  .ph.open b{color:var(--amber)}
  .ph.after{border-bottom-color:#6e6860}
  .ph.after b{color:#55534e}

  /* 주차 */
  .wk{background:var(--card);border:1px solid #e6e1d7;border-radius:13px;margin-bottom:12px;overflow:hidden}
  .wk.now{border-color:var(--g);box-shadow:0 0 0 2px #e4f1e8}
  .wk.past{background:#f7f6f2}
  .wkh{display:flex;align-items:center;gap:11px;padding:13px 17px;cursor:pointer;flex-wrap:wrap}
  .wkh .lb{font-family:'Gowun Batang',serif;font-size:19px;font-weight:700;letter-spacing:-.5px}
  .wk.past .wkh .lb{color:var(--mut)}
  .wkh .sb{font-size:12px;color:var(--mut)}
  .wkh .tag{font-size:10.5px;font-weight:700;color:#fff;background:var(--g);border-radius:9px;padding:2px 9px}
  .wkh .tag.op{background:var(--amber)}
  .wkh .ct{margin-left:auto;font-size:12px;color:var(--mut)}
  .wkh .ar{font-size:14px;color:var(--mut);transition:transform .15s}
  .wk.open .wkh .ar{transform:rotate(90deg)}
  .wkb{display:none;padding:0 13px 13px}
  .wk.open .wkb{display:block}

  /* 항목 */
  .it{border:1px solid var(--line2);border-radius:10px;background:#fdfcfa;margin-bottom:6px;overflow:hidden}
.it.tsep{margin-top:13px}
  .it:last-child{margin-bottom:0}
  .it.hit{border-color:var(--g);box-shadow:0 0 0 2px #e4f1e8}
  .ith{display:grid;grid-template-columns:78px minmax(140px,1fr) minmax(0,1.3fr) 66px 62px 92px;align-items:center;
 gap:12px;padding:10px 14px;cursor:pointer}
  .ith:hover{background:#f7f6f2}
  .ar2{font-size:10.5px;font-weight:700;border-radius:7px;padding:2px 0;text-align:center;display:block}
  .ar2.주문결제{color:#1d5fa8;background:#e8f0fa}
  .ar2.선지서점{color:var(--gd);background:#e6f2ea}
  .ar2.로뎀카페{color:#8a5a14;background:#fbf0dd}
  .ar2.제작물{color:#9A6414;background:#FBF3E6}
  .ar2.공사현장{color:#6e6860;background:#eeece6}
  .ar2.행정{color:#7a3fa0;background:#f2eafa}
  .ith .ti{font-size:14px;font-weight:700;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ith .sb2{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{font-size:10.5px;font-weight:700;border-radius:9px;padding:2px 0;text-align:center;display:block}
  .st.확인{color:#6e6860;background:#ece7dd}
  .st.결정{color:#fff;background:var(--warn)}
  .st.준비{color:#fff;background:var(--g)}
  .st.완료{color:#8a847a;background:#f2f0e9}
  .ith .du{font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
  .pg{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
  .pg .b{width:46px;height:5px;background:#ece7dd;border-radius:3px;overflow:hidden}
  .pg .b i{display:block;height:5px;background:var(--g)}

  .itb{display:none;padding:2px 14px 14px;border-top:1px dashed var(--line2);margin-top:-1px}
  .it.open .itb{display:block}
  .td{margin:11px 0 0;padding:0;list-style:none}
  .td li{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--soft);padding:3px 0}
  .td li i{flex:none;width:16px;height:16px;border:1.5px solid #cfc9bd;border-radius:4px;margin-top:4px}
  .td li.ok i{background:var(--g);border-color:var(--g);position:relative}
  .td li.ok i::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .td li.ok{color:var(--mut);text-decoration:line-through;text-decoration-color:#d6d0c4}
  .ask{margin-top:11px;background:#FBF3E6;border:1px solid #e3d6bb;border-radius:9px;padding:9px 13px}
  .ask b{display:block;font-size:12px;font-weight:700;color:#9A6414;margin-bottom:4px}
  .ask ul{margin:0;padding-left:16px}
  .ask li{font-size:12.5px;color:#6e6860;line-height:1.65}
  .nt{margin-top:11px;background:var(--gl);border-left:4px solid var(--g);border-radius:0 8px 8px 0;
    padding:9px 13px;font-size:12.5px;color:var(--soft);line-height:1.65}
  .nt.w{background:var(--warnbg);border-color:var(--warn)}
  .mt{margin-top:10px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .mt .ow{font-size:11.5px;color:var(--mut)}
  .tdoc{display:inline-block;margin-left:4px;font-size:12px;font-weight:700;color:var(--gd);background:#E8F4EC;border-radius:7px;padding:2px 8px;text-decoration:none;white-space:nowrap}
  .tdoc:hover{background:#CFEBD8}
  .dl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--gd);
    background:var(--gl);border:1px solid #c8e0d0;border-radius:8px;padding:5px 12px}
  .dl:hover{background:#e4f1e8}

  /* 장비 배치도 */
  .posdwg{margin-top:26px}
  .posdwg .hd3{display:flex;align-items:baseline;gap:11px;margin:0 0 12px;padding-bottom:9px;
    border-bottom:2px solid var(--line)}
  .posdwg .hd3 b{font-family:'Gowun Batang',serif;font-size:21px;font-weight:700;letter-spacing:-.5px}
  .posdwg .hd3 em{font-style:normal;font-size:12.5px;color:var(--mut)}
  .posdwg .hd3 a{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--gd)}
  .posgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .posgrid a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
    overflow:hidden}
  .posgrid a:hover{border-color:var(--g)}
  .posgrid img{width:100%;display:block}
  @media(max-width:760px){ .posgrid{grid-template-columns:1fr} }

  .err{background:var(--warnbg);border:1px solid var(--warn);border-radius:11px;padding:14px 17px;
    font-size:13px;color:var(--warn);line-height:1.7}
  .foot{margin:26px 0 10px;padding-top:13px;border-top:1px solid var(--line2);
    display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);flex-wrap:wrap;gap:6px}

  @media(max-width:760px){
    body{padding:12px}
    h1{font-size:22px}
    .dday{padding-right:14px}
    .dday b{font-size:28px}
    .ith{grid-template-columns:72px 1fr 64px;grid-auto-rows:auto;gap:8px 10px;padding:10px 12px}
    .ith .ti{grid-column:1/-1;grid-row:2;white-space:normal;font-size:14.5px}
    .ith .sb2{display:none}
    .ith .du{grid-column:1/3;grid-row:3;text-align:left}
    .pg{grid-column:3/4;grid-row:3}
  }

  /* ── 할 일 목록 (1~9 칸) ── */
  .tk-f{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 2px}
  .tk-f .lb{font-size:11.5px;color:var(--mut);font-weight:700;margin-right:2px}
  .tk-f .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
  .tk-f .chip em{font-style:normal;font-weight:500;margin-left:5px;font-size:11px;opacity:.65}
  .tk-r{margin-left:auto;display:flex;gap:6px;align-items:center}
  .tgl{font-size:12px;font-weight:600;color:var(--mut);border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;user-select:none}
  .tgl.on{background:#FFF1D6;border-color:#e8c98a;color:#9A6414}
  .tgl[data-s="open"].on{background:#EAF4ED;border-color:#c8e0d0;color:#056B2C}
  .shop{font-family:inherit;font-size:12px;color:var(--soft);border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px}
  @media (max-width:820px){ .tk-r{margin-left:0;width:100%} }
  .cat{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .cat-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fcfbf8;cursor:pointer;user-select:none}
  .cat.open .cat-h{border-bottom:1px solid var(--line)}
  .cat-h .n{flex:none;width:24px;height:24px;border-radius:7px;background:#056B2C;color:#fff;font-weight:900;font-size:13px;
    display:flex;align-items:center;justify-content:center}
  .cat-h b{font-size:16px;font-weight:900}
  .cat-h .cw{font-size:11.5px;color:var(--mut)}
  .cat-h .wt{font-size:11px;font-weight:700;color:#9A6414;background:#FFF1D6;border-radius:6px;padding:1px 7px}
  .cat-h .pr{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft);white-space:nowrap}
  .cat-h .bar2{width:100px;height:7px;border-radius:9px;background:#ece8df;overflow:hidden}
  .cat-h .bar2 i{display:block;height:100%;background:#07913B}
  .cat-h .tg2{font-size:12px;color:var(--mut);width:14px;text-align:center}
  .cat .cat-b{display:none}
  .cat.open .cat-b{display:block}
  .ti{padding:10px 16px 12px;border-bottom:1px solid #f0ece4}
  .ti:last-child{border-bottom:none}
  .ti.hit{background:#FFFBEA}
  .ti-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
  .ti-h b{font-size:14px;font-weight:800}
  .stg{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px}
  .stg.s{background:#E2F0E6;color:#2f6b43}.stg.c{background:#F6EBDD;color:#8a5a1a}.stg.a{background:#ECEAE5;color:#6a655c}
  .ti-h .due{margin-left:auto;font-size:11.5px;color:var(--mut)}
  .ti-h .due b{color:var(--ink)}
  .ti-h .due.late b{color:#B3382A}
  .ti-h .nt{flex-basis:100%;font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:1px;background:none !important;border:none !important;padding:0 !important}
  table.td{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  table.td td{padding:5px 8px;border-top:1px dashed #efebe3;vertical-align:top}
  table.td tr:first-child td{border-top:none}
  table.td td.sc{white-space:nowrap}
  
  table.td td.m{color:var(--soft);line-height:1.55}
  table.td td{border-left:none !important;border-right:none !important;background:none !important}
  table.td tr.dn td.t{color:var(--mut);text-decoration:line-through}
  .sb{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
  .sb.todo{background:#f1efea;color:#8a847a}
  .sb.wait{background:#FFF1D6;color:#9A6414}
  .sb.done{background:#E2F0E6;color:#2f6b43}
  .wb{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
  .wb.총무{background:#E3EEF9;color:#2f5f96}.wb.회계{background:#FDE8E4;color:#a2402e}.wb.단장님{background:#F3E5F0;color:#8a3f7a}
  .wb.잇다{background:#FFF6CC;color:#7a6200}.wb.건축위{background:#E8E6F7;color:#4a3f96}.wb.매니저{background:#E6F3F1;color:#2a6b62}
  .tk-empty{padding:28px;text-align:center;color:var(--mut);font-size:13px}
  .tk-help{font-size:12px;color:var(--mut);margin:8px 0 0}
  @media (max-width:720px){
    table.td td.m{display:block;width:auto;padding-top:0;border-top:none}
    .cat-h .bar2{display:none}
  }
  @media print{ .cat .cat-b{display:block !important} .tk-f{display:none} }
</style>
</head>
<body>
<div class="wrap">

  <div class="navrow">
    <span><a class="back" href="gsmch-1f.html">← 1층 성전보수</a> &nbsp;·&nbsp; <a class="back" href="gsmch-1f-calendar.html">사업단 일정 →</a></span>
    <span>총여선교회 사업단 &nbsp;|&nbsp; 업데이트 <b id="upd">—</b></span>
  </div>

              '로뎀카페':'도면 · 메뉴 · 기물 · 교육'};
const LABEL = {'확인':'확인 중','결정':'결정 필요','준비':'진행 중','완료':'완료'};
const trk = it => it.group || '공통';
let view = 'task';
let tkWho = '전체', tkSt = '전체', tkShop = '전체';
const OPEN = new Set();
let DATA = null, filter = '전체';

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function dday(to){
  const t = new Date(to+'T00:00:00+09:00');
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((t - today) / 86400000);
}
function weekState(w){
  const a = dday(w.from), b = dday(w.to);
  if (b < 0) return 'past';
  if (a <= 0 && b >= 0) return 'now';
  return 'next';
}
function prog(it){
  const t = it.todo || [];
  return { d: t.filter(x => x.done).length, n: t.length };
}

function renderSum(){
  const its = DATA.items;
  let d = 0, n = 0;
  its.forEach(it => { const p = prog(it); d += p.d; n += p.n; });
  const pc = n ? Math.round(d / n * 100) : 0;
  const cnt = {};
  its.forEach(it => cnt[it.state] = (cnt[it.state] || 0) + 1);
  const dd = dday(DATA.open);
  document.getElementById('sum').innerHTML =
    '<div class="dday"><b>D-' + dd + '</b><span>오픈 11. 22. (주일)</span></div>' +
    '<div class="sumg"><div class="t"><span>전체 할 일 <b>' + d + ' / ' + n + '</b></span><span>' + pc + '%</span></div>' +
    '<div class="bar"><i style="width:' + pc + '%"></i></div></div>' +
    '<div class="stt">' + ['결정','준비','확인','완료'].filter(s => cnt[s])
      .map(s => '<span>' + (LABEL[s] || s) + ' ' + cnt[s] + '</span>').join('') + '</div>';
}

function renderCtl(){
  const c = document.getElementById('ctl');
  c.innerHTML =
    '<div class="vsw">' +
      [['task','할 일 목록'],['gantt','전체 일정'],['week','주차별'],['dwg','도면 · 기기']].map(v =>
        '<button class="vb' + (view === v[0] ? ' on' : '') + '" data-v="' + v[0] + '">' + v[1] + '</button>').join('') +
    '</div>' +
    (view === 'task' || view === 'dwg' ? '' :
    ['전체'].concat(AREAS)
      .map(a => '<button class="chip' + (a === filter ? ' on' : '') + '" data-a="' + a + '">' + a + '</button>').join('') +
    '<span class="sp">' + (view === 'week' ? '항목을 누르면 할 일이 펼쳐집니다'
                                           : '가로가 주차입니다 · 막대를 누르면 주차별로 갑니다') + '</span>');
  c.querySelectorAll('.chip').forEach(b => b.onclick = () => { filter = b.dataset.a; renderCtl(); draw(); });
  c.querySelectorAll('.vb').forEach(b => b.onclick = () => { view = b.dataset.v; renderCtl(); draw(); });
}

function itemHTML(it, sep){
  const p = prog(it);
  const pc = p.n ? Math.round(p.d / p.n * 100) : 0;
  const todo = (it.todo || []).map(t =>
    '<li class="' + (t.done ? 'ok' : '') + '"><i></i><span>' + esc(t.t) + '</span></li>').join('');
  const note = it.note
    ? '<div class="nt' + (/미확인|필요/.test(it.note) ? ' w' : '') + '">' + esc(it.note) + '</div>' : '';
  const ask = (it.ask && it.ask.length)
    ? '<div class="ask"><b>확인할 내용</b><ul>' +
      it.ask.map(a => '<li>' + esc(a) + '</li>').join('') + '</ul></div>' : '';
  const meta = (it.owner || it.doc)
    ? '<div class="mt">' + (it.owner ? '<span class="ow">담당 ' + esc(it.owner) + '</span>' : '') +
      (it.doc ? '<a class="dl" href="' + esc(it.doc) + '">📄 ' + esc(it.docLabel || '문서 보기') + '</a>' : '') + '</div>'
    : '';
  return '<div class="it" id="' + esc(it.id) + '">' +
    '<div class="ith">' +
      '<span class="ar2 ' + esc(it.area) + '">' + esc(it.area) + '</span>' +
      '<span class="ti">' + esc(it.title) + '</span>' +
      '<span class="sb2">' + esc((it.todo || []).map(t => t.t).join(' · ')) + '</span>' +
      '<span class="st ' + esc(it.state) + '">' + esc(LABEL[it.state] || it.state) + '</span>' +
      '<span class="du">' + (it.due ? '~' + esc(it.due) : '') + '</span>' +
      '<span class="pg">' + p.d + '/' + p.n + '<span class="b"><i style="width:' + pc + '%"></i></span></span>' +
    '</div>' +
    '<div class="itb"><ul class="td">' + todo + '</ul>' + ask + note + meta + '</div>' +
  '</div>';
}


const POSDWG =
  '<div class="posdwg"><div class="hd3"><b>장비 배치도</b>' +
  '<em>실측평면도 2026. 10. 05. 기준 · 포스 · 키오스크 · 디스플레이 자리</em>' +
  '<a href="gsmch-1f-pos-committee.html">도입안에서 보기 →</a></div>' +

  '<a href="gsmch-1f-pos-book.jpg" target="_blank"><img src="gsmch-1f-pos-book.jpg" alt="서점 장비 배치"></a>' +
  '<a href="gsmch-1f-pos-cafe.jpg" target="_blank"><img src="gsmch-1f-pos-cafe.jpg" alt="카페 장비 배치"></a>' +
  '</div>' +
  '<div class="hd3" style="margin-top:22px"><b>설치 기기 목록 · 디지털 사이니지</b>' +
  '<em>잇다 확정 견적서 10/21 기준 · 건축위원회 전달용 (10/22)</em></div>' +
  '<div class="posgrid">' +
  '<a href="gsmch-1f-devices.jpg" target="_blank"><img src="gsmch-1f-devices.jpg" alt="1층 설치 기기 목록"></a>' +
  '<a href="gsmch-1f-signage.jpg" target="_blank"><img src="gsmch-1f-signage.jpg" alt="디지털 사이니지 형태 크기 위치"></a>' +
  '</div></div>';

function renderGantt(){
  const L = document.getElementById('list');
  const W = DATA.weeks, idx = {};
  W.forEach((w,i) => idx[w.id] = i);
  const nowId = (W.find(w => weekState(w) === 'now') || {}).id;

  let out = '<div class="gt"><div class="gwrap"><div class="grid">';
  out += '<div class="ghead"><div class="gc">주차 →</div>' + W.map(w =>
    '<div class="gh' + (w.id === nowId ? ' now' : '') + (w.phase === '오픈' ? ' op' : '') + '">' +
    '<b>' + w.label.replace(/\s/g,'') + '</b>' + (w.id === nowId ? '이번 주' : w.sub.slice(0,7)) + '</div>').join('') + '</div>';

  AREAS.forEach(g => {
    if (filter !== '전체' && filter !== g) return;
    const gi = DATA.items.filter(i => trk(i) === g);
    if (!gi.length) return;
    out += '<div class="gband ' + g + '"><b>' + g + '</b><em>' + (GSUB[g]||'') + '</em>' +
           '<span>' + gi.length + '건</span></div>';

    (DATA.streams[g] || []).forEach(st => {
      const its = gi.filter(i => i.stream === st);
      if (!its.length) return;
      // 겹치지 않는 항목끼리 한 줄에 모음
      const lanes = [];
      its.slice().sort((a,b) => idx[a.week] - idx[b.week]).forEach(it => {
        const a = idx[it.week], b = idx[it.weekTo || it.week];
        let put = false;
        for (const ln of lanes) {
          if (ln.every(x => idx[x.weekTo || x.week] < a || idx[x.week] > b)) { ln.push(it); put = true; break; }
        }
        if (!put) lanes.push([it]);
      });
      out += '<div class="grow"><div class="gname">' + st + '</div><div class="glanes">' +
        lanes.map(ln => {
          let cells = '';
          for (let c = 0; c < W.length; c++) {
            const it = ln.find(x => idx[x.week] === c);
            if (it) {
              const span = idx[it.weekTo || it.week] - c + 1;
              const cls = (it.state === '결정' ? ' dec' : it.state === '준비' ? ' now2' : '');
              cells += '<div class="gcell" style="grid-column:span ' + span + '">' +
                '<a class="gbar ' + it.area + cls + '" href="#' + it.id + '" title="' +
                esc(it.title) + ' — ' + (LABEL[it.state]||it.state) + (it.due ? ' · ~' + it.due : '') + '">' +
                esc(it.title) + '</a></div>';
              c += span - 1;
            } else cells += '<div class="gcell"></div>';
          }
          return '<div class="glane">' + cells + '</div>';
        }).join('') + '</div></div>';
    });
  });
  out += '</div></div></div>';
  L.innerHTML = out + POSDWG;
}

function renderList(){
  const L = document.getElementById('list');
  let curPhase = null, opened = 0;
  const PHSUB = {'오픈 준비':'10/18 ~ 11/21 · 공사와 나란히 준비합니다',
                 '오픈':'11/22 (주일)',
                 '오픈 이후':'11/23 ~ 당회 · 안정화와 인수인계'};
  const PHCLS = {'오픈 준비':'', '오픈':' open', '오픈 이후':' after'};
  L.innerHTML = DATA.weeks.map(w => {
    const SORD = ['결정','준비','확인','완료'];
    const its = DATA.items.filter(i => i.week === w.id && (filter === '전체' || trk(i) === filter))
      .slice().sort((a,b) => (AREAS.indexOf(trk(a)) - AREAS.indexOf(trk(b)))
                          || (SORD.indexOf(a.state) - SORD.indexOf(b.state)));
    if (!its.length) return '';
    const ws = weekState(w);
    let open = '';
    if (ws === 'now') open = ' open';
    else if (ws === 'next' && opened < 1) { open = ' open'; opened += 1; }
    let d = 0, n = 0;
    its.forEach(i => { const p = prog(i); d += p.d; n += p.n; });
    let ph = '';
    if (w.phase && w.phase !== curPhase) {
      curPhase = w.phase;
      const g = DATA.items.filter(x => {
        const ww = DATA.weeks.find(y => y.id === x.week);
        return ww && ww.phase === curPhase && (filter === '전체' || trk(x) === filter); });
      ph = '<div class="ph' + (PHCLS[curPhase] || '') + '"><b>' + curPhase + '</b>' +
           '<em>' + (PHSUB[curPhase] || '') + '</em>' +
           '<span>' + g.length + '건</span></div>';
    }
    return ph + '<div class="wk ' + ws + open + '">' +
      '<div class="wkh"><span class="ar">›</span><span class="lb">' + w.label + '</span>' +
        '<span class="sb">' + w.sub + '</span>' +
        (ws === 'now' ? '<span class="tag">이번 주</span>' : '') +
        (w.id === 'w6' ? '<span class="tag op">오픈</span>' : '') +
        '<span class="ct">' + its.length + '건 · 할 일 ' + d + '/' + n + '</span></div>' +
      '<div class="wkb">' + its.map((it,i) => itemHTML(it, i > 0 && trk(it) !== trk(its[i-1]))).join('') + '</div></div>';
  }).join('');

  L.insertAdjacentHTML('beforeend', POSDWG);
  L.querySelectorAll('.wkh').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
  L.querySelectorAll('.ith').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));

  const id = decodeURIComponent(location.hash.slice(1));
  if (id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.add('open', 'hit');
      el.closest('.wk').classList.add('open');
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120);
    }
  }
}

function start(j, offline){
  DATA = j;
  document.getElementById('upd').textContent = (function(u){var p=u.split(' ');return p[0].replace(/-/g,'. ')+'.'+(p[1]?' '+p[1]:'');})(j.updated)
    + (offline ? ' (문서 내장본)' : '');
  renderSum(); renderCtl(); draw();
}
function builtIn(){
  const el = document.getElementById('planData');
  if (!el) return null;
  try { return JSON.parse(el.textContent); } catch (e) { return null; }
}
fetch('gsmch-1f-plan.json?v=' + Date.now())
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => start(j, false))
  .catch(() => {
    const j = builtIn();
    if (j) { start(j, true); return; }
    document.getElementById('list').innerHTML =
      '<div class="err"><b>자료를 불러오지 못했습니다.</b><br>' +
      'gsmch-1f-plan.json 이 같은 폴더에 있어야 합니다.</div>';
  });


/* ── 할 일 목록 ── */
const SHOP = it => it.group === '선지서점' ? '서점' : it.group === '로뎀카페' ? '카페' : '공통';
const STL = {todo:'□', wait:'⏳', done:'✓'};
function todos(){ const a=[]; DATA.items.forEach(it => (it.todo||[]).forEach(t => a.push([it,t]))); return a; }
function passT(it, t){
  if (tkWho !== '전체' && t.who !== tkWho) return false;
  if (tkSt === 'wait' && t.st !== 'wait') return false;
  if (tkSt === 'open' && t.st === 'done') return false;
  if (tkShop !== '전체' && SHOP(it) !== tkShop) return false;
  return true;
}
function renderTasks(){
  const L = document.getElementById('list');
  const all = todos();
  const cnt = k => all.filter(([it,t]) => (k === '전체' || t.who === k) && (tkShop === '전체' || SHOP(it) === tkShop)).length;
  const scnt = k => all.filter(([it,t]) => t.st === k && (tkWho === '전체' || t.who === tkWho)).length;
  let f = '<div class="tk-f"><span class="lb">누구 일</span>' +
    ['전체'].concat(DATA.who || []).map(w => '<button class="chip' + (tkWho === w ? ' on' : '') + '" data-w="' + w + '">' + w +
      '<em>' + cnt(w) + '</em></button>').join('') +
    '<span class="tk-r">' +
      '<label class="tgl' + (tkSt === 'wait' ? ' on' : '') + '" data-s="wait">⏳ 확인 대기만</label>' +
      '<label class="tgl' + (tkSt === 'open' ? ' on' : '') + '" data-s="open">완료 숨기기</label>' +
      '<select class="shop" id="tkShop">' + ['전체','서점','카페','공통'].map(x =>
        '<option value="' + x + '"' + (tkShop === x ? ' selected' : '') + '>' + (x === '전체' ? '매장 전체' : x) + '</option>').join('') + '</select>' +
    '</span></div>';
  const filtered = tkWho !== '전체' || tkSt !== '전체' || tkShop !== '전체';
  const wk = DATA.weeks;
  const nowI = Math.max(0, wk.findIndex(w => weekState(w) === 'now'));
  const near = it => { const i = wk.findIndex(w => w.id === it.week); return i >= 0 && i <= nowI + 1; };
  let out = '', shown = 0;
  (DATA.cats || []).forEach(c => {
    const its = DATA.items.filter(it => it.cat === c.n);
    const all2 = []; its.forEach(it => (it.todo||[]).forEach(t => all2.push(t)));
    const dn = all2.filter(t => t.st === 'done').length, wt = all2.filter(t => t.st === 'wait').length;
    const pc = all2.length ? Math.round(dn / all2.length * 100) : 0;
    let body = '';
    its.forEach(it => {
      const rows = (it.todo||[]).filter(t => passT(it, t));
      if (filtered && !rows.length) return;
      if (!filtered && (it.todo||[]).length && (it.todo||[]).every(t => t.st === 'done') && !near(it)) return;
      const sh = SHOP(it), cls = sh === '서점' ? 's' : sh === '카페' ? 'c' : 'a';
      const late = (it.todo||[]).some(t => t.st !== 'done') && weekState(wk.find(w => w.id === it.week) || wk[0]) === 'past';
      body += '<div class="ti" id="' + it.id + '"><div class="ti-h"><b>' + esc(it.title) + '</b><span class="stg ' + cls + '">' + sh + '</span>' +
        '<span class="due' + (late ? ' late' : '') + '">언제까지 <b>' + esc(it.due || '') + '</b></span>' +
        (it.note ? '<span class="nt">' + esc(it.note) + '</span>' : '') + '</div>';
      if (rows.length) {
        body += '<table class="td"><colgroup><col style="width:96px"><col><col style="width:78px"><col style="width:38%"></colgroup>' + rows.map(t =>
          '<tr class="' + (t.st === 'done' ? 'dn' : '') + '"><td class="sc"><span class="sb ' + t.st + '">' + STL[t.st] + (t.date ? ' ' + esc(t.date) : '') + '</span></td>' +
          '<td class="t">' + esc(t.t) + '</td><td class="wc"><span class="wb ' + esc(t.who) + '">' + esc(t.who) + '</span></td>' +
          '<td class="m">' + esc(t.memo || '') + (t.doc ? ' <a class="tdoc" href="' + esc(t.doc) + '" target="_blank">📄 ' + esc(t.docLabel || '문서 보기') + '</a>' : '') + '</td></tr>').join('') + '</table>';
      }
      body += '</div>';
      shown += rows.length;
    });
    if (filtered && !body) return;
    const autoOpen = filtered || wt > 0 || its.some(it => near(it) && (it.todo||[]).some(t => t.st !== 'done'));
    const isOpen = OPEN.has(c.n) ? true : OPEN.has(-c.n) ? false : autoOpen;
    out += '<div class="cat' + (isOpen ? ' open' : '') + '" data-c="' + c.n + '"><div class="cat-h"><span class="n">' + c.n + '</span><b>' + esc(c.name) + '</b>' +
      '<span class="cw">' + esc(c.who) + '</span>' + (wt ? '<span class="wt">⏳ ' + wt + '</span>' : '') +
      '<span class="pr">' + dn + ' / ' + all2.length + '<span class="bar2"><i style="width:' + pc + '%"></i></span><span class="tg2">' + (isOpen ? '▲' : '▼') + '</span></span></div>' +
      '<div class="cat-b">' + (body || '<div class="tk-empty">해당하는 할 일이 없습니다</div>') + '</div></div>';
  });
  if (filtered && !out) out = '<div class="tk-empty">조건에 맞는 할 일이 없습니다</div>';
  L.innerHTML = f + out;
  L.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { tkWho = b.dataset.w; renderTasks(); });
  L.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { tkSt = (tkSt === b.dataset.s ? '전체' : b.dataset.s); renderTasks(); });
  const sel = document.getElementById('tkShop'); if (sel) sel.onchange = () => { tkShop = sel.value; renderTasks(); };
  L.querySelectorAll('.cat-h').forEach(h => h.onclick = () => {
    const n = +h.parentElement.dataset.c, o = h.parentElement.classList.toggle('open');
    OPEN.delete(n); OPEN.delete(-n); OPEN.add(o ? n : -n);
    h.querySelector('.tg2').textContent = o ? '▲' : '▼';
  });
  const id = decodeURIComponent(location.hash.slice(1));
  if (id) { const el = document.getElementById(id); if (el) { el.classList.add('hit'); el.closest('.cat').classList.add('open');
    setTimeout(() => el.scrollIntoView({behavior:'smooth', block:'center'}), 120); } }
}
function renderDwg(){ document.getElementById('list').innerHTML = POSDWG; }
function draw(){ view === 'task' ? renderTasks() : view === 'gantt' ? renderGantt() : view === 'dwg' ? renderDwg() : renderList(); }
window.addEventListener('hashchange', () => { if (DATA) { view = 'task'; renderCtl(); renderTasks(); } });
</script>

<script>
/* ── JPG 저장 · 인쇄 ── */
function _h2c(cb){
  if (window.html2canvas) return cb();
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=cb;
  s.onerror=function(){ alert('이미지 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주십시오.'); };
  document.head.appendChild(s);
}
function _today(){
  var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function saveJpg(sel, name, btn){
  var el=document.querySelector(sel); if(!el) return;
  var t=btn?btn.innerHTML:null; if(btn){btn.disabled=true; btn.textContent='저장 중…';}
  document.body.classList.add('shot');
  _h2c(function(){
    html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false}).then(function(cv){
      cv.toBlob(function(b){
        var a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download=name+'_'+_today()+'.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      },'image/jpeg',0.93);
    }).catch(function(){ alert('이미지로 저장하지 못했습니다.'); })
    .then(function(){
      document.body.classList.remove('shot');
      if(btn){btn.disabled=false; btn.innerHTML=t;}
    });
  });
}
</script>

<script>
function printPlan(){
  var st=document.getElementById('pgsz');
  if(!st){st=document.createElement('style');st.id='pgsz';document.head.appendChild(st);}
  st.textContent='@page{size:A4 ' + ((typeof view!=='undefined' && view==='gantt')?'landscape':'portrait') + ';margin:10mm}';
  window.print();
}
</script>
<div id="pvw" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;align-items:center;justify-content:center;padding:20px;cursor:zoom-out"><img style="max-width:100%;max-height:100%;border-radius:10px;background:#fff"></div>
<script>
document.addEventListener('click',function(e){var a=e.target.closest('a.tdoc,a.dl');if(!a)return;var h=a.getAttribute('href')||'';if(!/\.(jpe?g|png|webp|gif)$/i.test(h))return;e.preventDefault();var o=document.getElementById('pvw');o.querySelector('img').src=h;o.style.display='flex';});
