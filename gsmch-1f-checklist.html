<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오픈 체크리스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--g:#07913B;--gd:#056B2C;--ink:#2c2a26;--soft:#55534e;--mut:#8a847a;--line:#dcd9d1;--line2:#eeece6;--bg:#faf9f5;--card:#fff;
    --cafe:#8a4b12;--cafel:#F6E7D3;--book:#2f6b45;--bookl:#E2EFE6;--com:#5e5a52;--coml:#ECEAE4;--warn:#B3382A;--amber:#9A6414}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',sans-serif;font-size:16px;line-height:1.6}
  .wrap{max-width:900px;margin:0 auto}
  a{color:inherit;text-decoration:none}
  .navrow{font-size:13px;color:var(--mut);padding-bottom:8px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .navrow a{color:var(--gd);font-weight:600}
  h1{font-family:'Gowun Batang',serif;font-size:30px;font-weight:700;margin:18px 0 0;letter-spacing:-.6px}
  .lead{font-size:15px;color:var(--soft);margin:6px 0 0}
  .lead a{color:var(--gd);font-weight:700;text-decoration:underline}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}.tools{display:inline-flex;gap:6px;margin-bottom:6px}
  .tbtn{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:13px;font-weight:600;color:#55534e;background:#fff;border:1px solid #dcd9d1;border-radius:999px;padding:5px 12px;cursor:pointer}
  .tbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .sum{margin-top:16px;background:var(--card);border:1px solid #e6e1d7;border-radius:13px;padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:15px}
  .sum b{font-family:'Gowun Batang',serif;font-size:24px;margin-right:3px;color:var(--gd)}
  .sum .w b{color:var(--warn)} .sum .y b{color:var(--amber)}

  .jump{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .jump a{font-size:16px;font-weight:800;color:var(--soft);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 16px}
  .jump a.on{background:#2c2a26;border-color:#2c2a26;color:#fff}
  .jump a::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--c,#2c2a26)}
  .jump a.w{--c:#B3382A}.jump a.c{--c:#C07A2C}.jump a.b{--c:#3d8a5a}.jump a.o{--c:#9a948a}.jump a.a{--c:#bbb}

  section{margin-top:14px}
  .sh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;color:#fff;background:#2c2a26}
  .sh h2{margin:0;font-size:21px;font-weight:800}
  .sh span{font-size:13.5px;opacity:.8}
  .sh.w{background:#B3382A}.sh.c{background:var(--cafe)}.sh.b{background:var(--book)}.sh.o{background:var(--com)}.sh.a{background:#9a948a}
  .sh .tbtn{margin-left:auto;color:#fff;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4)}

  h3{font-size:17px;font-weight:800;margin:18px 0 6px 4px;display:flex;align-items:baseline;gap:8px}
  h3 em{font-style:normal;font-size:13px;color:var(--mut);font-weight:600}
  h3.sub{font-size:15px;color:var(--soft);margin-top:12px}
  .row{display:flex;gap:10px;align-items:flex-start;background:#FFF6CC;border:1px solid #efe3a8;border-radius:10px;padding:9px 12px;margin:5px 0}
  .row.late{background:#FFE9A8;box-shadow:inset 4px 0 0 #E0A800}
  .row .cb{flex:none;width:22px;height:22px;margin-top:2px;border:2px solid #C9A227;border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
  .row .t{flex:1;min-width:0;font-size:16.5px;font-weight:600}
  .row .t small{display:block;font-size:13px;color:var(--mut);font-weight:500}
  .row .t .mm{display:block;font-size:13px;color:#6b5a1e;background:rgba(255,255,255,.65);border-radius:6px;padding:2px 7px;margin-top:3px;font-weight:500}
  .tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:0 7px;margin-right:5px;vertical-align:2px}
  .tag.d{background:#eef0f5;color:#3d4a6b}.tag.late{background:#FDE9E4;color:var(--warn)}.tag.wt{background:#FBF3E6;color:var(--amber)}
  .tag.s카페{background:var(--cafel);color:var(--cafe)}.tag.s서점{background:var(--bookl);color:var(--book)}.tag.s공통{background:var(--coml);color:var(--com)}
  .wh{display:inline-block;font-size:12.5px;font-weight:700;color:#3d4a6b;background:#eef0f5;border-radius:6px;padding:0 7px;margin-left:5px;vertical-align:2px}
  details.dn{margin:4px 0 2px 4px}
  details.dn summary{font-size:13.5px;color:var(--mut);cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:5px}
  details.dn summary::before{content:'✓';display:inline-flex;width:18px;height:18px;border-radius:5px;background:#07913B;color:#fff;font-size:12px;align-items:center;justify-content:center;font-weight:900}
  details.dn .row{background:#fff;border-color:var(--line2);color:var(--mut)}
  details.dn .row .cb{background:#07913B;border-color:#07913B}
  details.dn .row .t{font-weight:500;text-decoration:line-through;text-decoration-color:#c9c4b8}
  details.after{margin-top:26px}
  details.after>summary{cursor:pointer;list-style:none}
  details.after>summary .sh::after{content:'펼치기';font-size:13px;opacity:.8;margin-left:auto}
  details.after[open]>summary .sh::after{content:'접기'}
  h3.st{font-size:18px;margin:22px 0 4px;padding:6px 12px;border-radius:9px;display:inline-flex}
  h3.st.s카페{background:var(--cafel);color:var(--cafe)}h3.st.s서점{background:var(--bookl);color:var(--book)}h3.st.s공통{background:var(--coml);color:var(--com)}
  details.cat{margin:8px 0 4px}
  details.cat>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:8px;padding:9px 12px;background:#f2f0e9;border-radius:9px;font-size:16.5px;font-weight:800}
  details.cat>summary::before{content:'▾';color:var(--mut);font-size:14px}
  details.cat:not([open])>summary::before{content:'▸'}
  details.cat>summary em{font-style:normal;font-size:13px;color:var(--mut);font-weight:600}
  details.cat>summary em i{font-style:normal;font-weight:700}details.cat>summary em i.lt{color:var(--warn)}details.cat>summary em i.tw{color:var(--amber)}
  details.cat>summary::-webkit-details-marker{display:none}
  .fold{display:flex;gap:6px;margin:10px 0 0}
  .fold button{font-family:inherit;font-size:13px;color:var(--soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
  .empty{color:var(--mut);font-size:15px;padding:8px 4px}
  .foot{margin-top:30px;padding-top:10px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
  @media (max-width:640px){
    body{padding:12px;font-size:15px} h1{font-size:25px}
    .jump a{font-size:13.5px;padding:5px 11px} .sh h2{font-size:18px}
    .row .t{font-size:15.5px} .tbtn{font-size:11.5px;padding:3px 9px}
  }
  @media print{.jump,.tools,.navrow,.foot,.sh .tbtn{display:none !important}body{background:#fff;padding:0}.row{break-inside:avoid}details{display:block}details>*{display:block}}
  body.shot .jump,body.shot .tools,body.shot .navrow{display:none !important}
  .ptabs{display:flex;gap:8px;margin-top:16px}
  .ptabs a{flex:1;text-align:center;font-size:20px;font-weight:800;color:#8a847a;background:#f2f0e9;border:2px solid #dcd9d1;border-radius:14px;padding:14px 10px;white-space:nowrap}
  .ptabs a.on{box-shadow:0 2px 0 #000}
  .ptabs{clear:both}
  .ptabs a.on{background:#2c2a26;border-color:#2c2a26;color:#fff}
  @media (max-width:640px){.ptabs a{font-size:16px;padding:11px 6px}}
</style>
</head>

    const date=md(t.date),due=md(it.due);
    T.push({t:t.t,who:t.who||it.owner||'',st:t.st,done:t.st==='done',memo:t.memo||'',ctx:it.title,date,due,store:storeOf(t.t,it),cat:fixCat(catOf(t.t,it),storeOf(t.t,it)),
      key:date?date.key:(due?due.key:'9999')});
  }));
  return T;
}
function thisWeek(){const td=new Date(TODAY),ws=new Date(td);ws.setDate(td.getDate()-td.getDay());const we=new Date(ws);we.setDate(ws.getDate()+6);
  const k=x=>`2026-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;return [k(ws),k(we),ws,we];}
function row(r){
  const late=!r.done&&r.key<TODAY&&r.key!=='9999';
  const when=r.date?`<span class="tag ${late?'late':'d'}">${fmt(r.date)}</span>`:(r.due?`<span class="tag ${late?'late':'d'}">~${fmt(r.due)}</span>`:'');
  return `<div class="row ${late?'late':''}"><span class="cb">${r.done?'✓':''}</span><span class="t">${when}${r.st==='wait'?'<span class="tag wt">답 기다림</span>':''}${esc(r.t)}<b class="wh">${esc(r.who)}</b><small>${esc(r.ctx)}</small>${r.memo&&!r.done?`<span class="mm">${esc(r.memo)}</span>`:''}</span></div>`;
}
const WE_=thisWeek()[1];
function group(list,showStore){
  const open=list.filter(r=>!r.done),done=list.filter(r=>r.done);
  let h='';
  CATORDER.concat([...new Set(list.map(r=>r.cat))].filter(c=>!CATORDER.includes(c))).forEach(c=>{
    const o=open.filter(r=>r.cat===c),d=done.filter(r=>r.cat===c);if(!o.length&&!d.length)return;
    const lt=o.filter(r=>r.key<TODAY).length,tw=o.filter(r=>r.key>=TODAY&&r.key<=WE_).length;
    h+=`<details class="cat"><summary><b>${esc(c)}</b><em>남음 ${o.length}${lt?` · <i class="lt">지난 날짜 ${lt}</i>`:''}${tw?` · <i class="tw">이번 주 ${tw}</i>`:''}</em></summary>`+o.sort((a,b)=>a.key<b.key?-1:1).map(r=>(showStore?`<div style="position:relative">`:'')+row(r).replace('<span class="t">','<span class="t">'+(showStore?`<span class="tag s${r.store}">${SN[r.store]}</span>`:''))+(showStore?'</div>':'')).join('');
    if(d.length)h+=`<details class="dn"><summary>끝난 일 ${d.length}건</summary>${d.map(row).join('')}</details>`;
    h+='</details>';
  });
  return h||'<div class="empty">없습니다.</div>';
}
function render(){
  const T=build();
  document.getElementById('upd').textContent=D.updated||'—';
  const [WS,WE,ws,we]=thisWeek();
  const after=T.filter(r=>r.key>OPEN&&r.key!=='9999');
  const pre=T.filter(r=>!after.includes(r));
  const late=pre.filter(r=>!r.done&&r.key<TODAY&&r.key!=='9999');
  const wk=pre.filter(r=>!r.done&&r.key>=TODAY&&r.key<=WE);
  const nOpen=pre.filter(r=>!r.done).length,nDone=pre.filter(r=>r.done).length;
  document.getElementById('sum').innerHTML=`<span>오픈 전 남은 일 <b>${nOpen}</b>건</span><span class="w">지난 날짜 확인 <b>${late.length}</b></span><span class="y">이번 주 <b>${wk.length}</b></span><span>끝남 <b style="color:var(--gd)">${nDone}</b></span>`;
  const J=[['c','#cafe','로뎀카페'],['b','#book','선지서점'],['o','#com','공통'],['a','#after','오픈 뒤']];
  document.getElementById('jump').innerHTML=J.map(([c,h,n])=>`<a class="${c}" data-t="${h.slice(1)}" href="${h}">${n}</a>`).join('');
  const jpg=(id,nm)=>`<button class="tbtn" onclick="saveJpg('#${id}','gsmch_체크리스트_${nm}',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>JPG</button>`;
  let h='';
  [['cafe','c','카페'],['book','b','서점'],['com','o','공통']].forEach(([id,c,k])=>{const L=pre.filter(r=>r.store===k);
    h+=`<section id="${id}"><div class="sh ${c}"><h2>${SN[k]}</h2><span>남음 ${L.filter(r=>!r.done).length} · 끝남 ${L.filter(r=>r.done).length}</span>${jpg(id,SN[k])}</div>${group(L,false)}</section>`;});
  h+=`<section id="after"><div class="sh a"><h2>오픈 뒤 (11/23 ~ 12월)</h2><span>남음 ${after.filter(r=>!r.done).length}</span>${jpg('after','오픈뒤')}</div>${group(after,true)}</section>`;
  document.getElementById('body').innerHTML=h;
  showTab(CUR);
}
let CUR=location.hash.slice(1)||'cafe';
function showTab(t){CUR=t;['cafe','book','com','after'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=id===t?'':'none';});document.querySelectorAll('#jump a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));const af=document.getElementById('after');if(af&&t==='after')af.open=true;}
document.getElementById('jump').addEventListener('click',ev=>{const a=ev.target.closest('a');if(!a)return;ev.preventDefault();history.replaceState(null,'','#'+a.dataset.t);showTab(a.dataset.t);});
render();
fetch('gsmch-1f-plan.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.items){D=j;render();}}).catch(()=>{});

function saveJpg(sel,name,btn){
  const go=()=>{document.body.classList.add('shot');const t=btn.innerHTML;btn.textContent='저장 중…';
    html2canvas(document.querySelector(sel),{backgroundColor:'#ffffff',scale:2,logging:false,ignoreElements:n=>n.classList&&n.classList.contains('tbtn')}).then(cv=>{
      cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);const d=new Date();a.download=name+'_'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.jpg';document.body.appendChild(a);a.click();a.remove();},'image/jpeg',0.93);
    }).catch(()=>alert('이미지로 저장하지 못했습니다.')).then(()=>{document.body.classList.remove('shot');btn.innerHTML=t;});};
  if(window.html2canvas)return go();
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=go;document.head.appendChild(s);
}
</script>
