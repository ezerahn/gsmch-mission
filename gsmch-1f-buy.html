<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오픈 비용</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--text:#2c2a26;--muted:#8a847a;--soft:#6e6860;--line:#ece8de;--s:#5b574f;--b:#3d6bb0;--c:#b5622d;--ok:#1f7a3f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
.back{display:inline-block;font-size:14px;color:var(--soft);text-decoration:none;padding:7px 14px;border:1px solid #e6e1d7;border-radius:20px;background:#fff;margin-bottom:12px}
h1{font-size:30px}.lead{font-size:16px;color:var(--soft);margin-top:4px}.upd{font-size:13px;color:var(--muted)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;color:var(--soft)}.sum b{display:block;font-size:22px;color:var(--text)}
.fl{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.fl button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid #dcd9d1;background:#fff;border-radius:18px;padding:5px 14px;cursor:pointer;color:var(--soft)}.fl button.on{background:var(--text);border-color:var(--text);color:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
th{background:#f4f2ec;font-size:13px;color:var(--soft);text-align:left;padding:9px 10px}td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
td.a,th.a{text-align:right;white-space:nowrap;font-weight:700}td.d{white-space:nowrap;color:var(--soft)}
.k{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:5px;padding:0 6px;margin-right:6px}.k.s{background:var(--s)}.k.b{background:var(--b)}.k.c{background:var(--c)}
.r{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 8px}.r.y{background:#e3f1e6;color:var(--ok)}.r.n{background:#fff4c7;color:#8a6a12}
td small{display:block;font-size:12.5px;color:var(--muted)}td a{color:#3d6bb0;text-decoration:none;font-size:13px}
.und{color:#b07a12;font-weight:700}.h{font-size:19px;margin:22px 0 8px}.sum .big{flex:1;min-width:240px}.sum .big span{font-size:14px;font-weight:700;color:var(--soft)}.sum .big b{font-size:26px;margin:2px 0}.sum .big em{font-style:normal;font-size:13px;color:var(--muted)}.r.e{background:#e8eefb;color:#3d6bb0}tr.tot td{background:#f4f2ec;font-weight:700}tr.cat td{background:#eef3ee;font-weight:700;font-size:15.5px;color:#2f5d3f;border-top:2px solid #cfdccf}tr.cat small{display:inline;font-weight:500;margin-left:6px}.nt{font-size:13.5px;color:var(--soft);margin-top:12px}td a{white-space:nowrap}

</style></head><body><div class="wrap">
<a class="back" href="gsmch-1f.html">← 1층 성전보수</a>
<h1>오픈 비용</h1><p class="lead">이번 오픈에 드는 돈 — 한 번 드는 비용과 매달 나가는 비용 · 서점 / 카페 / 공통</p><span class="upd" id="upd"></span>
<div class="sum" id="sum"></div><div class="fl" id="fl"></div>
<h2 class="h">한 번 드는 비용</h2><table><thead><tr><th>날짜</th><th>품목</th><th>구매처</th><th class="a">금액</th><th>상태</th></tr></thead><tbody id="t1"></tbody></table>
<h2 class="h">매달 나가는 비용</h2><table><thead><tr><th>날짜</th><th>품목</th><th>구매처</th><th class="a">한 달</th><th>상태</th></tr></thead><tbody id="t2"></tbody></table>
<p class="nt">금액은 부가세 포함 · <b>견적</b>은 견적서 기준이라 결제 뒤 바뀔 수 있음 · <b>확인</b> · <b>예정</b>은 합계에 안 들어감 · 카드 번호 · 주문번호 · 주소는 올리지 않음</p>
</div><script>
const N={s:'공통',b:'서점',c:'카페'};let J,F='';const won=n=>n==null?'<span class="und">—</span>':n.toLocaleString()+'원';
const SC={'결제 완료':'y','견적':'e','확인':'n','예정':'n'};
function rows(L){const cats=[];L.forEach(o=>{if(!cats.includes(o.cat))cats.push(o.cat)});const sum=A=>A.reduce((a,o)=>a+(o.amt||0),0);
return cats.map(c=>{const G=L.filter(o=>o.cat===c),nn=G.filter(o=>o.amt==null).length;const dc=G.every(o=>o.doc&&o.doc===G[0].doc)?G[0].doc:'';return '<tr class="cat"><td colspan="3">'+c+(dc?' <a href="'+dc+'">자세히 ›</a>':'')+' <small>'+G.length+'건'+(nn?' · 금액 없는 것 '+nn+'건':'')+'</small></td><td class="a">'+(sum(G)?sum(G).toLocaleString()+'원':'<span class="und">아직 없음</span>')+'</td><td></td></tr>'+G.map(o=>'<tr><td class="d">'+(o.d&&o.st==='결제 완료'?(+o.d.slice(5,7))+'/'+(+o.d.slice(8,10)):'')+'</td><td><span class="k '+o.c+'">'+N[o.c]+'</span><b>'+o.t+'</b>'+(o.memo?'<small>'+o.memo+'</small>':'')+'</td><td>'+(o.shop||'<span class="und">확인</span>')+(o.url?' <a href="'+o.url+'" target="_blank" rel="noopener">구매처 ↗</a>':'')+'</td><td class="a">'+won(o.amt)+'</td><td><span class="r '+SC[o.st]+'">'+o.st+'</span></td></tr>').join('')}).join('')+'<tr class="tot"><td colspan="3">합계 <small style="display:inline">금액 적힌 것만</small></td><td class="a">'+sum(L).toLocaleString()+'원</td><td></td></tr>'}
function render(){const A=J.items,L=A.filter(o=>!F||o.c===F);const S=(k,c)=>A.filter(o=>o.k===k&&(!c||o.c===c)).reduce((a,o)=>a+(o.amt||0),0);
document.getElementById('upd').textContent='업데이트 '+J.updated.replace(/-/g,'. ')+'.';
const card=(t,k)=>'<div class="big"><span>'+t+'</span><b>'+S(k).toLocaleString()+'원</b><em>카페 '+S(k,'c').toLocaleString()+' · 서점 '+S(k,'b').toLocaleString()+' · 공통 '+S(k,'s').toLocaleString()+'</em></div>';
document.getElementById('sum').innerHTML=card('한 번 드는 비용','once')+card('매달 나가는 비용','month')+'<div class="big"><span>아직 금액 없는 것</span><b>'+A.filter(o=>o.amt==null).length+'건</b><em>확인 · 예정</em></div>';
document.getElementById('fl').innerHTML=[['','전체'],['c','카페'],['b','서점'],['s','공통']].map(x=>'<button class="'+(F===x[0]?'on':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>').join('');
document.getElementById('t1').innerHTML=rows(L.filter(o=>o.k==='once'));document.getElementById('t2').innerHTML=rows(L.filter(o=>o.k==='month'))}
document.addEventListener('click',e=>{const b=e.target.closest('#fl button');if(b){F=b.dataset.f;render()}});
fetch('gsmch-1f-buy.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{J=d;render()});
</script></body></html>
