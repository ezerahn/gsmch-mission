<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>구매 내역</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--text:#2c2a26;--muted:#8a847a;--soft:#6e6860;--line:#ece8de;--s:#5b574f;--b:#3d6bb0;--c:#b5622d;--ok:#1f7a3f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 60px}
.back{display:inline-block;font-size:14px;color:var(--soft);text-decoration:none;padding:7px 14px;border:1px solid #e6e1d7;border-radius:20px;background:#fff;margin-bottom:12px}
h1{font-size:30px}.lead{font-size:16px;color:var(--soft);margin-top:4px}.upd{font-size:13px;color:var(--muted)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.sum div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;color:var(--soft)}.sum b{display:block;font-size:22px;color:var(--text)}
.fl{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}.fl button{font:inherit;font-size:14px;font-weight:700;border:1.5px solid #dcd9d1;background:#fff;border-radius:18px;padding:5px 14px;cursor:pointer;color:var(--soft)}.fl button.on{background:var(--text);border-color:var(--text);color:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15px}
th{background:#f4f2ec;font-size:13px;color:var(--soft);text-align:left;padding:9px 10px}td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
td.a,th.a{text-align:right;white-space:nowrap;font-weight:700}td.d{white-space:nowrap;color:var(--soft)}
.k{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:5px;padding:0 6px;margin-right:6px}.k.s{background:var(--s)}.k.b{background:var(--b)}.k.c{background:var(--c)}
.r{display:inline-block;font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 8px}.r.y{background:#e3f1e6;color:var(--ok)}.r.n{background:#fff4c7;color:#8a6a12}
td small{display:block;font-size:12.5px;color:var(--muted)}td a{color:#3d6bb0;text-decoration:none;font-size:13px}
.und{color:#b07a12;font-weight:700}
@media(max-width:760px){th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6){display:none}}
</style></head><body><div class="wrap">
<a class="back" href="gsmch-1f.html">← 1층 성전보수</a>
<h1>구매 내역</h1><p class="lead">무엇을 · 어디서 · 얼마에 샀는지 — 나중에 영수증 찾고 정리할 때 봅니다.</p><span class="upd" id="upd"></span>
<div class="sum" id="sum"></div><div class="fl" id="fl"></div>
<table><thead><tr><th>날짜</th><th>품목</th><th>구매처</th><th class="a">금액</th><th>결제</th><th>산 사람</th><th>영수증</th></tr></thead><tbody id="tb"></tbody></table>
</div><script>
const N={s:'사업단',b:'서점',c:'카페'};let J,F='';const won=n=>n==null?'<span class="und">확인</span>':n.toLocaleString()+'원';
function render(){const L=J.items.filter(o=>!F||o.c===F);const tot=L.reduce((a,o)=>a+(o.amt||0),0);
document.getElementById('upd').textContent='업데이트 '+J.updated.replace(/-/g,'. ')+'.';
document.getElementById('sum').innerHTML='<div><b>'+L.length+'건</b>구매</div><div><b>'+tot.toLocaleString()+'원</b>금액 적힌 것만 합계</div><div><b>'+L.filter(o=>o.amt==null).length+'건</b>금액 확인 필요</div><div><b>'+L.filter(o=>o.rc).length+' / '+L.length+'</b>영수증 받음</div>';
document.getElementById('fl').innerHTML=[['','전체'],['c','카페'],['b','서점'],['s','사업단']].map(x=>'<button class="'+(F===x[0]?'on':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>').join('');
document.getElementById('tb').innerHTML=L.map(o=>'<tr><td class="d">'+(o.d?(+o.d.slice(5,7))+'/'+(+o.d.slice(8,10)):'예정')+'</td><td><span class="k '+o.c+'">'+N[o.c]+'</span><b>'+o.t+'</b>'+(o.memo?'<small>'+o.memo+'</small>':'')+'</td><td>'+(o.shop||'<span class="und">확인</span>')+(o.url?'<br><a href="'+o.url+'" target="_blank" rel="noopener">구매처 ↗</a>':'')+'</td><td class="a">'+won(o.amt)+'</td><td>'+(o.pay||'—')+'</td><td>'+(o.who||'—')+'</td><td>'+(o.rc?'<span class="r y">'+o.rc+'</span>':'<span class="r n">아직</span>')+'</td></tr>').join('')}
document.addEventListener('click',e=>{const b=e.target.closest('#fl button');if(b){F=b.dataset.f;render()}});
fetch('gsmch-1f-buy.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{J=d;render()});
</script></body></html>
