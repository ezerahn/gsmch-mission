<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사업단 일정</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--text:#2c2a26;--muted:#8a847a;--soft:#6e6860;--line:#ece8de;--s:#5b574f;--b:#3d6bb0;--c:#b5622d;--ok:#1f7a3f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.back{display:inline-block;font-size:14px;color:var(--soft);text-decoration:none;padding:7px 14px;border:1px solid #e6e1d7;border-radius:20px;background:#fff;margin-bottom:12px}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
.lead{font-size:16px;color:var(--soft);margin-top:4px}
.upd{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted)}
.open{display:flex;gap:10px;margin:16px 0 18px}
.open div{flex:1;border-radius:14px;padding:13px 18px;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.open small{font-size:14px;font-weight:500;opacity:.9}
.open .c{background:var(--c)}.open .b{background:var(--b)}
.tabs{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.tabs button{position:relative;font:inherit;cursor:pointer;text-align:center;font-size:16px;font-weight:700;color:var(--soft);background:#f2f0e9;border:2px solid #dcd9d1;border-radius:11px;padding:20px 4px 8px;white-space:nowrap}
.tabs button i{position:absolute;left:8px;top:4px;font-style:normal;font-size:11px;color:#9a948a;font-weight:700}
.tabs button small{display:block;font-size:11.5px;font-weight:500;color:#9a948a;margin-top:1px}
.tabs button.done small:after{content:" ✓";color:var(--ok);font-weight:700}
.tabs button.op{border-color:#c8553d}.tabs button.op small{color:#c8553d;font-weight:700}
.tabs button.on{background:var(--text);border-color:var(--text);color:#fff}.tabs button.on small,.tabs button.on i{color:#d8d4ca}
.tabs button.m12{margin-left:10px}
.sum{display:flex;gap:16px;align-items:center;margin:16px 0 10px;font-size:15px;color:var(--soft)}
.sum b{font-size:20px;color:var(--text)}.sum b.k{color:var(--ok)}
.bar{flex:1;height:10px;background:#ece8de;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.tools{display:flex;gap:8px}
.tools button{font:inherit;font-size:13.5px;font-weight:700;color:var(--soft);background:#fff;border:1.5px solid #dcd9d1;border-radius:18px;padding:5px 12px;cursor:pointer}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1.5px solid #dcd9d1;border-radius:14px;overflow:hidden;table-layout:fixed}
th{font-size:15px;font-weight:700;padding:10px 12px;text-align:left;color:#fff}
th.d{background:var(--text);width:96px}th.s{background:var(--s)}th.b{background:var(--b)}th.c{background:var(--c);width:34%}th.n{background:#8a847a;width:190px}
td{vertical-align:top;padding:8px 9px;border-top:1.5px solid var(--line);border-left:1.5px solid var(--line);font-size:15px}
td.d{border-left:0;font-weight:700;font-size:18px;white-space:nowrap}td.d small{display:block;font-size:13px;color:var(--muted);font-weight:500}
td.d.sun{color:#c8553d}td.d.sat{color:var(--b)}
tr.today td{background:#fffbea}tr.today td.d .tg{display:inline-block;margin-top:4px;font-size:11px;background:var(--text);color:#fff;border-radius:6px;padding:0 7px}
tr.past td.d{color:#aaa49a}
tr.und td.d{font-size:14px;color:var(--muted)}
.i{display:flex;gap:8px;align-items:flex-start;border-radius:9px;padding:6px 8px;margin:0 0 5px;line-height:1.4;font-weight:700;cursor:pointer;user-select:none}
.i:last-child{margin-bottom:0}
.i u{flex:none;width:19px;height:19px;border:2px solid #b9a65a;border-radius:5px;background:#fff;margin-top:1px;text-decoration:none;font-size:13px;line-height:15px;text-align:center;color:#fff;font-weight:700}
.i.no{background:#fff4c7}
.i.ok{color:#8a847a;font-weight:500}.i.ok u{background:var(--ok);border-color:var(--ok)}.i.ok u:after{content:"✓"}
.i em{display:block;font-style:normal;font-size:12.5px;font-weight:500;color:#7a746a}
.i.op span>b{color:#c8553d}
.grp{border:2px solid #e8d9a0;border-radius:10px;padding:6px;margin:0 0 5px;background:#fffdf3}
.gh{font-size:15px;font-weight:700;padding:2px 4px 6px;display:flex;justify-content:space-between;align-items:center}
.gh b{font-size:13px;color:#9a6414;background:#fbeec4;border-radius:6px;padding:0 8px}.gh b.all{color:#fff;background:var(--ok)}
.grp .i{font-size:14px;padding:4px 7px;margin-bottom:3px}.grp .i u{width:17px;height:17px;line-height:13px}
td.n{font-size:13.5px;color:var(--soft);line-height:1.5;background:#faf9f5}
tr.today td.n{background:#fbf6dd}
.lg{margin-top:12px;font-size:13.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.lg i{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.empty{color:#c9c3b8;font-size:13px}
@media(max-width:820px){
 .tabs{grid-template-columns:repeat(5,1fr)}.tabs button.m12{margin-left:0}
 table,tbody,tr,td,th{display:block;width:100%!important}
 thead,tr.hd{display:none}
 tr{border-top:2px solid #dcd9d1}
 td{border-left:0;border-top:0;padding:4px 10px}
 td.d{padding-top:10px}
 td[data-l]:before{content:attr(data-l);display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:5px;padding:0 7px;margin-bottom:4px}
 td.cs:before{background:var(--s)}td.cb:before{background:var(--b)}td.cc:before{background:var(--c)}td.n:before{background:#8a847a}
 td.emp{display:none}
 .open div{font-size:16px}
}
@media print{.back,.tools,.tabs{display:none}body{background:#fff}.i{cursor:default}}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="gsmch-1f.html">← 1층 성전보수</a>
<h1>사업단 일정</h1>
<p class="lead">주마다 한 일과 남은 일을 봅니다 — 한 일은 체크, 안 한 일은 노란 바탕. 네모를 누르면 체크됩니다.</p>
<span class="upd" id="upd"></span>
<div class="open" id="open"></div>
<div class="tabs" id="tabs"></div>
<div class="sum"><span id="cnt"></span><div class="bar"><i id="bar"></i></div><div class="tools"><button onclick="window.print()">인쇄</button><button onclick="resetMe()" title="이 기기에서 누른 체크를 지웁니다">내 체크 지우기</button></div></div>
<table><thead><tr class="hd"><th class="d">날짜</th><th class="s">사업단 (공통)</th><th class="b">서점</th><th class="c">카페</th><th class="n">비고</th></tr></thead><tbody id="tb"></tbody></table>
<div class="lg"><span><i style="background:#fff4c7;border:2px solid #b9a65a"></i>아직 안 한 일</span><span><i style="background:#1f7a3f"></i>끝난 일</span><span>누른 체크는 이 기기에 저장 · 모두에게 보이는 체크는 총무가 반영</span></div>
</div>
<script>
const WEEKS=[["2026-11-01","11월","1 ~ 7","1주"],["2026-11-08","","8 ~ 14","2주"],["2026-11-15","","15 ~ 21","3주"],["2026-11-22","","22 ~ 28","4주"],["2026-11-29","","29 ~ 12/5","5주"],["2026-12-06","12월","6 ~ 12","1주"],["2026-12-13","","13 ~ 19","2주"],["2026-12-20","","20 ~ 26","3주"],["2026-12-27","","27 ~ 31","4주"]];
const DOW=["주일","월","화","수","목","금","토"];
const MEK="gsmch-week-me";let ME={};try{ME=JSON.parse(localStorage.getItem(MEK)||"{}")}catch(e){ME={}}
let J=null,CUR=null;
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const add=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ds(d)};
const TODAY=ds(new Date());
const isDone=o=>(o.id in ME)?ME[o.id]:o.done;
const esc=s=>s;
function wkOf(o){if(!o.d)return null;const d=o.d.slice(0,10);for(let i=WEEKS.length-1;i>=0;i--)if(d>=WEEKS[i][0])return i;return null}
function curWeek(){for(let i=WEEKS.length-1;i>=0;i--)if(TODAY>=WEEKS[i][0])return i;return 0}
function itemH(o){const dn=isDone(o);return '<div class="i '+(dn?'ok':'no')+(o.open?' op':'')+'" data-id="'+o.id+'"><u></u><span>'+(o.open?'<b>'+o.t+'</b>':o.t)+(o.em?'<em>'+o.em+'</em>':'')+'</span></div>'}
function cellH(list){let h='',gs={};list.forEach(o=>{if(o.g){(gs[o.g]=gs[o.g]||[]).push(o)}});const seen={};
 list.forEach(o=>{if(o.g){if(seen[o.g])return;seen[o.g]=1;const L=gs[o.g],k=L.filter(isDone).length;h+='<div class="grp"><div class="gh">'+o.g+' <b class="'+(k==L.length?'all':'')+'">'+k+' / '+L.length+'</b></div>'+L.map(itemH).join('')+'</div>'}else h+=itemH(o)});return h}
function weekItems(w){return J.items.filter(o=>wkOf(o)===w)}
function render(){
 const w=CUR,start=WEEKS[w][0],cw=curWeek();
 // tabs
 document.getElementById('tabs').innerHTML=WEEKS.map((x,i)=>{const L=weekItems(i),all=L.length&&L.every(isDone),op=J.open.some(o=>wkOf({d:o[0]})===i);
  const lab=op?J.open.filter(o=>wkOf({d:o[0]})===i).map(o=>o[2].replace(/로뎀|선지/,'').replace(/카페 오픈|서점 오픈/,m=>m)).join(' · '):(i===cw?'이번 주':x[3]);
  return '<button class="'+[i===w?'on':'',all&&i<cw+1?'done':'',op?'op':'',i===5?'m12':''].join(' ')+'" data-w="'+i+'">'+(x[1]?'<i>'+x[1]+'</i>':'')+x[2]+'<small>'+(op&&i===cw?'이번 주 · '+lab:lab)+'</small></button>'}).join('');
 // rows
 let rows='',L=weekItems(w);
 for(let k=0;k<7;k++){const d=add(start,k);if(d>"2026-12-31")break;const dd=new Date(d+"T00:00:00");
  const day=J.items.filter(o=>o.d===d);const note=J.notes[d]||'';
  const cls=[d===TODAY?'today':'',d<TODAY?'past':''].join(' ');
  rows+=row(cls,(dd.getMonth()+1)+'/'+dd.getDate(),DOW[k],k===0?'sun':(k===6?'sat':''),day,note,d===TODAY)}
 // ranges (예: 11/25~28)
 const rg={};L.filter(o=>o.d.includes('~')).forEach(o=>{(rg[o.d]=rg[o.d]||[]).push(o)});
 Object.keys(rg).forEach(r=>{const a=r.split('~');const m=+a[0].slice(5,7),d1=+a[0].slice(8,10);rows+=row('und',m+'/'+d1+'~'+a[1],'날짜 미정','',rg[r],'')});
 // 날짜 미정 — 이번 주 이후 탭에만
 if(w>=cw){const U=J.items.filter(o=>!o.d);if(U.length)rows+=row('und','날짜 미정','','',U,'')}
 document.getElementById('tb').innerHTML=rows;
 const all=L.concat(w>=cw?J.items.filter(o=>!o.d):[]),k=all.filter(isDone).length;
 document.getElementById('cnt').innerHTML=(w===cw?'이번 주 ':'이 주 ')+'<b>'+all.length+'</b>가지 중 <b class="k">'+k+'</b>가지 완료';
 document.getElementById('bar').style.width=(all.length?k/all.length*100:0)+'%';
}
function row(cls,dl,sub,dc,list,note,today){const by=c=>list.filter(o=>o.c===c);
 const td=(c,lab)=>{const L=by(c);return '<td class="c'+c+(L.length?'':' emp')+'" data-l="'+lab+'">'+cellH(L)+'</td>'};
 return '<tr class="'+cls+'"><td class="d '+dc+'">'+dl+'<small>'+sub+'</small>'+(today?'<span class="tg">오늘</span>':'')+'</td>'+td('s','사업단')+td('b','서점')+td('c','카페')+'<td class="n'+(note?'':' emp')+'" data-l="비고">'+note+'</td></tr>'}
document.addEventListener('click',e=>{const t=e.target.closest('.tabs button');if(t){CUR=+t.dataset.w;render();return}
 const i=e.target.closest('.i[data-id]');if(i){const o=J.items.find(x=>x.id===i.dataset.id);const v=!isDone(o);if(v===o.done)delete ME[o.id];else ME[o.id]=v;try{localStorage.setItem(MEK,JSON.stringify(ME))}catch(x){}render()}});
function resetMe(){ME={};try{localStorage.removeItem(MEK)}catch(x){}render()}
fetch('gsmch-1f-week.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{J=d;
 document.getElementById('upd').textContent='업데이트 '+d.updated.replace(/-/g,'. ')+'.';
 document.getElementById('open').innerHTML=d.open.map(o=>{const x=new Date(o[0]+"T00:00:00");return '<div class="'+o[1]+'">'+(x.getMonth()+1)+'/'+x.getDate()+' 주일 · '+o[2]+(o[3]?' <small>'+o[3]+'</small>':'')+'</div>'}).join('');
 CUR=curWeek();render()});
</script>
</body>
</html>
