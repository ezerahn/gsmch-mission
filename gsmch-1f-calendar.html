let PLAN={};try{PLAN=JSON.parse(document.getElementById('planData').textContent)}catch(e){}
const WHOS=['단장님','건축위','잇다','매니저','총무','회계'];
let WHO=new URLSearchParams(location.search).get('who')||'전체';
const norm=x=>x.replace(/<[^>]+>/g,'').replace(/[\s·()\[\],.\-—~→/]/g,'');
const big2=x=>{const n=norm(x),o=new Set();for(let i=0;i<n.length-1;i++)o.add(n.slice(i,i+2));return o;};
const sim=(a,b)=>{const A=big2(a),B=big2(b);if(!A.size||!B.size)return 0;let c=0;A.forEach(x=>{if(B.has(x))c++});return c/Math.min(A.size,B.size);};
const md=x=>{const r=/(\d{1,2})\s*\/\s*(\d{1,2})/.exec(x||'');return r?{m:+r[1],d:+r[2]}:null;};
const esc=x=>String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TODOS=[],UNDATED=[];
function buildTodos(){
  TODOS=[];UNDATED=[];ROWS.forEach(r=>{if(r.kind==='kev'){r.who='';r.sub=null;r.memo='';r.dn=r.dn0;r.t=r.t0;}});
  ROWS.splice(0,ROWS.length,...ROWS.filter(r=>r.kind==='kev'));
  (PLAN.items||[]).forEach(it=>(it.todo||[]).forEach(t=>{
    const who=t.who||it.owner||'',p=md(t.date);
    const base={who,st:t.st,t:t.t,memo:t.memo||'',ctx:(it.group||'')+' · '+it.title};
    if(!p||p.m<10||p.m>12){UNDATED.push(Object.assign(base,{due:md(it.due)}));return;}
    const key=`2026-${pad(p.m)}-${pad(p.d)}`;
    let ev=null,bv=0;ROWS.forEach(r=>{if(r.kind==='kev'&&r.key===key){const v=sim(r.e[2],t.t);if(v>bv){bv=v;ev=r;}}});
    if(ev&&bv>=0.33){ev.who=ev.who||who;(ev.sub=ev.sub||[]).push(t);if(!ev.memo&&base.memo)ev.memo=base.memo;return;}
    const w=new Date(2026,p.m-1,p.d).getDay();
    ROWS.push({m:p.m,d:p.d,w,key,dn:t.st==='done',kind:'ktd',who,st:t.st,memo:base.memo,ctx:base.ctx,t:esc(t.t)+(t.st==='wait'?' <span class="st wt">답 기다림</span>':(t.st!=='done'&&key<TODAY?' <span class="st ck">확인 필요</span>':''))});
  }));
  ROWS.forEach(r=>{if(r.kind==='kev'&&r.sub&&r.e[4]!=='done'&&r.e[4]!=='todo'){r.dn=r.sub.every(t=>t.st==='done');
    if(!r.dn&&r.key<TODAY&&!/확인 필요/.test(r.t))r.t+=' <span class="st ck">확인 필요</span>';
    if(r.sub.some(t=>t.st==='wait')&&!r.dn)r.t+=' <span class="st wt">답 기다림</span>';}});
}
function rowHtml(r){
  return `<div class="row ${r.big?'big':''} ${r.dn?'done':'todo'} ${!r.dn&&r.key<TODAY?'late':''} ${r.kind}"><span class="cb">${r.dn?'✓':''}</span><span class="d ${r.w==0?'sun':r.w==6?'sat':''}">${r.m}/${r.d} (${DOW[r.w]})</span><span class="t">${r.t}${r.who?` <b class="wh">${esc(r.who)}</b>`:''}${r.ctx&&r.kind==='ktd'?`<small class="cx">${esc(r.ctx)}</small>`:''}${r.memo&&!r.dn?`<small class="mm">${esc(r.memo)}</small>`:''}</span></div>`;
}
function renderLists(){
  const cnt={};WHOS.forEach(w=>cnt[w]=0);
  ROWS.concat(UNDATED).forEach(r=>{if(cnt[r.who]!=null&&!(r.dn||r.st==='done'))cnt[r.who]++;});
  document.getElementById('whobar').innerHTML=['전체'].concat(WHOS.filter(w=>cnt[w])).map(w=>`<button class="${w===WHO?'on':''}" data-w="${w}">${w}${w==='전체'?'':` <em>${cnt[w]}</em>`}</button>`).join('');
  const pick=r=>WHO==='전체'||r.who===WHO;
  for(const m of [10,11,12]){
    const rs=ROWS.filter(r=>r.m===m&&pick(r)).sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:(a.kind===b.kind?0:a.kind==='kev'?-1:1));
    const nd=rs.filter(r=>r.dn).length,nl=rs.length-nd,nw=rs.filter(r=>!r.dn&&r.key<TODAY).length;
    const el=document.getElementById('list'+m);if(!el)continue;
    el.innerHTML=`<div class="lh"><h4>${m}월 체크리스트${WHO==='전체'?'':' · '+WHO}</h4><span class="ls"><span class="k1">✓ 끝남 ${nd}</span><span class="k2">☐ 남음 ${nl}</span>${nw?`<span class="k3">지난 날짜 확인 ${nw}</span>`:''}</span><button class="lt" onclick="this.closest('.list').classList.toggle('only')">남은 것만 보기</button></div>`+(rs.length?rs.map(rowHtml).join(''):'<div class="empty">이 달에는 없습니다.</div>');
  }
  const un=UNDATED.filter(r=>r.st!=='done'&&pick(r)).sort((a,b)=>(a.due?a.due.m*100+a.due.d:9999)-(b.due?b.due.m*100+b.due.d:9999));
  const ORD=['잇다','건축위','단장님','매니저','총무','회계'];const grp={};un.forEach(r=>{(grp[r.who]=grp[r.who]||[]).push(r);});
  const keys=Object.keys(grp).sort((a,b)=>(ORD.indexOf(a)<0?99:ORD.indexOf(a))-(ORD.indexOf(b)<0?99:ORD.indexOf(b)));
  const SUB={'잇다':'잇다에 물어볼 것','건축위':'건축위에 확인할 것','단장님':'단장님께 여쭐 것','매니저':'매니저님과 확인할 것','총무':'총무 할 일','회계':'회계 확인'};
  document.getElementById('undated').innerHTML=`<div class="lh"><h4>날짜 정하지 않은 할 일${WHO==='전체'?'':' · '+WHO}</h4><span class="ls"><span class="k2">☐ ${un.length}</span></span></div><p class="unl">진도표에 있는데 날짜가 없는 일을 대상별로 나눴습니다. 왼쪽은 그 묶음의 마감입니다.</p>`+
    keys.map(k=>`<details class="ug" ${WHO!=='전체'||k==='잇다'||k==='건축위'?'open':''}><summary class="ugh"><b>${esc(SUB[k]||k)}</b><span>${grp[k].length}건</span><i>펼치기 · 접기</i></summary>`+grp[k].map(r=>{const late=r.due&&new Date(2026,r.due.m-1,r.due.d)<new Date(TODAY);return `<div class="row todo ${late?'late':''}"><span class="cb"></span><span class="d">${r.due?r.due.m+'/'+r.due.d+' 마감':'—'}</span><span class="t">${esc(r.t)}${r.st==='wait'?' <span class="st wt">답 기다림</span>':''}<small class="cx">${esc(r.ctx)}</small>${r.memo?`<small class="mm">${esc(r.memo)}</small>`:''}</span></div>`}).join('')+'</details>').join('');
}
document.getElementById('whobar').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;WHO=b.dataset.w;
  const u=new URL(location.href);if(WHO==='전체')u.searchParams.delete('who');else u.searchParams.set('who',WHO);history.replaceState(null,'',u);renderLists();});
buildTodos();renderLists();
fetch('gsmch-1f-plan.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&j.items){PLAN=j;buildTodos();renderLists();}}).catch(()=>{});

function showM(m){document.querySelectorAll('.month').forEach(x=>x.style.display=x.id=='m'+m?'':'none');document.querySelectorAll('#mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));try{localStorage.setItem('calM',m)}catch(e){}}
document.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>showM(b.dataset.m));
(function(){let m=String(+TODAY.slice(5,7));try{m=localStorage.getItem('calM')||m}catch(e){}showM(m);})();
(function(){
 const st=new Date(2026,9,27),N=28,CW=100/N,Dw="일월화수목금토",FC={pos:"#3f6fb0",coffee:"#8a5a2b",cup:"#1f8a83",build:"#7a756c",setup:"#5c7a5e",open:"#D9644A"};
 const ix=k=>Math.round((new Date(2026,+k.slice(5,7)-1,+k.slice(8,10))-st)/864e5);
 const ti=ix(TODAY); let h='<div class="fr hd"><div class="fl"></div><div class="fc">';
 for(let i=0;i<N;i++){const d=new Date(st.getTime()+i*864e5),w=d.getDay();h+=`<div class="fd ${w==0?'s':''} ${i==ti?'td':''}" style="left:${i*CW}%;width:${CW}%"><b>${d.getDate()==1?(d.getMonth()+1)+'/':''}${d.getDate()}</b></div>`}
 h+='</div></div>';
 ["pos","coffee","cup","build","setup","open"].forEach(l=>{const c=FC[l];
  const ev=EVENTS.filter(e=>e[1]==l&&ix(e[0])>=0&&ix(e[0])<N&&e[0]!='2026-10-29'&&!/노트북/.test(e[2])).sort((a,b)=>a[0]<b[0]?-1:1);if(!ev.length)return;
  h+=`<div class="fr"><div class="fl"><b class="tg" style="background:${c}">${LABEL[l]}</b></div><div class="fc">`;
  for(let i=0;i<N;i++){const w=new Date(st.getTime()+i*864e5).getDay();if(w==0||i==ti)h+=`<i class="gl ${i==ti?'td':''}" style="left:${i*CW}%;width:${i==ti?CW:0}%"></i>`}
  const a=ix(ev[0][0]),b=ix(ev[ev.length-1][0]);
  if(b>a)h+=`<span class="fline" style="left:${(a+.5)*CW}%;width:${(b-a)*CW}%;background:${c}55"></span>`;
  BANDS.filter(x=>x[0]==l).forEach(x=>{h+=`<span class="fline" style="left:${(ix(x[1])+.5)*CW}%;width:${(ix(x[2])-ix(x[1]))*CW}%;background:${c}"></span>`});
  let prev=-9,up=false;
  ev.forEach(e=>{const xi=ix(e[0]);up=(xi-prev<3)?!up:false;prev=xi;const SH={'카페 메뉴판 위치 확정':'메뉴판','견적 · 발주':'발주','서점 입고':'입고','전체 교육':'교육','시음':'시음','원두 결정':'원두','더그리트 미팅':'업체 미팅','결정':'결정','계약':'계약','서점 가구 미팅 1차':'가구 미팅','준공':'준공','입구 진열장 결정':'진열장','서점 · 카페 현장 셋업':'셋업','테스트 운영':'테스트','서점 · 카페 오픈':'오픈'};const raw=e[2].replace(/\s*<em>.*?<\/em>/g,'');const nm=SH[raw]||raw;
   h+=`<div class="fs" style="left:${ix(e[0])*CW}%;width:${CW}%"><i class="fdot ${e[3]&&e[3]!=='d'?'':'f'} ${e[3]==='d'?'dc':''}" style="border-color:${c};${e[3]&&e[3]!=='d'?'':'background:'+c}"></i><span>${nm}</span></div>`});
  h+='</div></div>';});
 document.getElementById('flow').innerHTML=h;
})();
function saveFlow(btn){var el=document.querySelector('.flow');var t=btn.innerHTML;btn.disabled=true;btn.textContent='저장 중…';
 _h2c(function(){html2canvas(el,{backgroundColor:'#ffffff',scale:2,windowWidth:1200,ignoreElements:function(n){return n.classList&&n.classList.contains('tbtn')},
  onclone:function(d){var c=d.querySelector('.flow');c.style.width='1150px';d.querySelector('.fsc').style.overflow='visible';}
 }).then(function(cv){cv.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='gsmch_오픈준비흐름.jpg';document.body.appendChild(a);a.click();a.remove();},'image/jpeg',0.93)})
 .catch(function(){alert('이미지로 저장하지 못했습니다.')}).then(function(){btn.disabled=false;btn.innerHTML=t;});});}

function _h2c(cb){
  if(window.html2canvas) return cb();
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onload=cb; s.onerror=function(){alert('이미지 저장 기능을 불러오지 못했습니다.');};
  document.head.appendChild(s);
}
function saveMonth(m,btn){
  var el=document.getElementById('m'+m); var t=btn.innerHTML; btn.disabled=true; btn.textContent='저장 중…';
  _h2c(function(){
    html2canvas(el,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,windowWidth:1000,
      ignoreElements:function(n){return n.classList&&(n.classList.contains('tbtn')||n.classList.contains('list'));},
      onclone:function(d){var c=d.getElementById('m'+m); c.style.width='968px'; c.style.margin='0';}
    }).then(function(cv){
      cv.toBlob(function(b){
        var a=document.createElement('a'); a.href=URL.createObjectURL(b);
        a.download='gsmch_사업단일정_2026-'+(m<10?'0':'')+m+'.jpg';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      },'image/jpeg',0.93);
    }).catch(function(){alert('이미지로 저장하지 못했습니다.');})
    .then(function(){btn.disabled=false; btn.innerHTML=t;});
  });
}
</script>
